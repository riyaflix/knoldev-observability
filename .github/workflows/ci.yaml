name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sample-api Docker image
        run: docker build -t sample-api:v1 ./apps/sample-api

      - name: Lint Helm chart
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm lint
        run: helm lint ./helm/sample-api

      - name: Create Kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ci-cluster

      - name: Load image into Kind
        run: kind load docker-image sample-api:v1 --name ci-cluster

      - name: Deploy with Helm
        run: helm install sample-api ./helm/sample-api

      - name: Wait for rollout
        run: kubectl rollout status deployment/sample-api --timeout=60s

      - name: Smoke test
        run: |
          kubectl port-forward svc/sample-api 8080:8000 &
          sleep 5
          curl --fail http://localhost:8080/health